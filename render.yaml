services:
  - type: web
    name: vibeshield
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_CONCURRENT_SCANS
        value: "2"
      - key: SCANNER_ACCESS_TOKEN
        sync: false
